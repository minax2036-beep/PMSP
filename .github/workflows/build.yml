name: PMSP Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PMSP
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Check executable
        run: ./build/pmsp-get --version
      - name: HTTPS smoke test
        run: |
          ./build/pmsp-get example.com / > response.txt
          cat response.txt
          grep -q "Example Domain" response.txt
