name: PMSP Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PMSP
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Check executable
        run: ./build/pmsp-get --version
      - name: HTTPS smoke test
        run: |
          ./build/pmsp-get example.com / > response.txt
          grep -q "Example Domain" response.txt
      - name: HTTPS download test
        run: |
          ./build/pmsp-get example.com / --output example.html
          test -s example.html
          grep -q "Example Domain" example.html
      - name: HTTPS redirect test
        run: |
          ./build/pmsp-get httpbin.org /redirect/1 > redirect-response.txt
          grep -q '"url"' redirect-response.txt

  psp-build:
    runs-on: ubuntu-24.04
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Check out PMSP
        uses: actions/checkout@v4
      - name: Build PMSP PRX
        run: make -C psp/prx
      - name: Build independent Netconf Demo PRX
        run: make -C psp/netconf_demo
      - name: Build PMSP Tester EBOOT.PBP
        run: make -C psp/tester
      - name: Collect PSP release files
        run: |
          mkdir -p dist
          cp psp/prx/pmsp.prx dist/pmsp.prx
          cp psp/netconf_demo/netdialog_demo.prx dist/netdialog_demo.prx
          cp psp/tester/EBOOT.PBP dist/EBOOT.PBP
          ls -lh dist
      - name: Upload PSP build
        uses: actions/upload-artifact@v4
        with:
          name: pmsp-psp-build
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, psp-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download PSP build
        uses: actions/download-artifact@v4
        with:
          name: pmsp-psp-build
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pmsp.prx
            dist/netdialog_demo.prx
            dist/EBOOT.PBP
          fail_on_unmatched_files: true
